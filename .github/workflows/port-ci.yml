# OSS ツールチェイン移植 (issue #1) の CI
#
# 基準ツールチェインは MSYS2 UCRT64 (mingw-w64 GCC)。
#   - windows-ucrt64 : 基準環境。ビルドとテスト実行、成果物のアップロード
#   - linux-cross    : Linux ホストからのクロスビルドが壊れていないかの確認
#
# clang-cl を採らない理由: clang は UTF-8 以外の実行時文字コードを受け付けず
# (`-fexec-charset=CP932` が invalid value になる)、既存の非 ASCII narrow
# リテラル 1,944箇所を wide へ機械変換しない限りビルドできない。
# GCC-mingw ならその変換が不要。詳細は docs/port/phase0-report.md §4。
name: port-ci

on:
  push:
    branches: [main, "port/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  windows-ucrt64:
    name: MSYS2 UCRT64 (基準)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: リンクしている CRT を記録
        run: |
          objdump -p build/tests/core_tests.exe | grep -i "DLL Name" | sort -u

      - uses: actions/upload-artifact@v4
        with:
          name: nyanfi-port-ucrt64
          path: |
            build/tests/*.exe
            build/*.a
          if-no-files-found: error

  linux-cross:
    name: Linux クロスビルド
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 依存の導入
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++-mingw-w64-x86-64 cmake ninja-build

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            --toolchain cmake/toolchain-mingw-w64.cmake \
            -DCMAKE_BUILD_TYPE=Release

      # Ubuntu の mingw-w64 は既定が msvcrt 系のため、ここはあくまで
      # 「Linux ホストからビルドが通ること」の確認に留める。
      # テストの実行と成果物は UCRT64 側 (windows-ucrt64) を正とする。
      - name: Build
        run: cmake --build build

  release:
    name: リリース
    needs: [windows-ucrt64, linux-cross]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nyanfi-port-ucrt64
          path: dist

      - name: アーカイブを作成
        run: |
          cd dist
          zip -r "../nyanfi-port-${GITHUB_REF_NAME}-ucrt64.zip" .

      - uses: softprops/action-gh-release@v2
        with:
          files: nyanfi-port-*.zip
          body: |
            MSYS2 UCRT64 (mingw-w64 GCC) でビルドした移植作業中の成果物です。

            現時点の中身はロジック層の静的ライブラリとテスト実行ファイルで、
            **アプリケーション本体 (NyanFi.exe) はまだ含まれません**。
            GUI の移植は issue #1 の Phase 2 以降です。
